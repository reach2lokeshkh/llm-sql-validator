[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llm-sql-validator"
version = "0.1.0"
description = "A progressive validation framework for LLM-generated SQL queries"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [
    { name = "Lokesh Kumar H", email = "reach2lokeshkh@gmail.com" },
]
keywords = [
    "llm",
    "sql",
    "validation",
    "text-to-sql",
    "generative-ai",
    "data-engineering",
    "query-validation",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "sqlglot>=20.0.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1.0",
    "mypy>=1.0",
]
redshift = [
    "sqlglot>=20.0.0",
]
bigquery = [
    "sqlglot>=20.0.0",
]

[project.urls]
Homepage = "https://github.com/reach2lokeshkh/llm-sql-validator"
Documentation = "https://github.com/reach2lokeshkh/llm-sql-validator#readme"
Repository = "https://github.com/reach2lokeshkh/llm-sql-validator"
Issues = "https://github.com/reach2lokeshkh/llm-sql-validator/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_sql_validator"]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = [
    "ignore:Field name \"schema\".*:UserWarning",
]

[tool.mypy]
python_version = "3.9"
strict = true
